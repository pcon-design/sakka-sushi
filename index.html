    overflow-x:hidden;

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    padding:26px 18px 20px;
    overflow:hidden;
    background:#0c0c0c;
  }
  .hero-blur{
    position:absolute; inset:-20%;
    background:
      radial-gradient(circle at 18% 20%, rgba(214,59,53,.55), transparent 40%),
      radial-gradient(circle at 82% 15%, rgba(217,178,107,.35), transparent 38%),
      radial-gradient(circle at 55% 70%, rgba(214,59,53,.4), transparent 42%);
    filter:blur(38px);
    opacity:.55;
  }
  .hero-emojis{
    position:absolute; inset:0; z-index:0;
    font-size:64px; opacity:.16; filter:blur(6px);
    display:flex; align-items:center; justify-content:space-around;
    padding:0 6px; pointer-events:none; user-select:none;
  }
  .hero-inner{ position:relative; z-index:1; text-align:center; }
  .logo-mark{
    width:78px; height:78px; margin:0 auto 10px;
    filter:drop-shadow(0 6px 18px rgba(214,59,53,.4));
  }
  .hero-title{
    font-weight:800; font-size:23px; letter-spacing:-.01em; margin:0 0 4px;
  }
  .hero-sub{
    color:var(--ink-70); font-size:13px; font-weight:500; margin:0 0 18px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .hero-sub .dot{ width:3px; height:3px; border-radius:50%; background:var(--ink-45); }

  .search-wrap{
    position:relative; max-width:420px; margin:0 auto;
  }
  .search-wrap input{
    width:100%;
    background:var(--bg-card);
    border:1.5px solid var(--border);
    color:var(--white);
    border-radius:999px;
    padding:13px 18px 13px 46px;
    font-size:14px; font-family:'Poppins',sans-serif; font-weight:500;
  }
  .search-wrap input::placeholder{ color:var(--ink-45); }
  .search-wrap input:focus{ outline:none; border-color:var(--red); }
  .search-icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; line-height:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--white); opacity:.55; pointer-events:none;
  }
  .search-icon svg{ width:16px; height:16px; display:block; }
  .search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:none;
    background:var(--bg-card-2); color:var(--ink-70); font-size:13px;
    cursor:pointer; display:none; align-items:center; justify-content:center;
  }
  .search-wrap.has-text .search-clear{ display:flex; }

  /* ---------- Tabs ---------- */
  .tabs-wrap{ position:sticky; top:0; z-index:20; }
  .tabs{
    position:relative; z-index:20;
    display:flex; gap:8px;
    padding:14px;
    background:rgba(17,17,17,.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    overflow-x:auto; scrollbar-width:none;
    scroll-snap-type:x proximity;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tabs-wrap::after{
    content:'';
    position:absolute; top:0; right:0; bottom:1px; width:34px;
    background:linear-gradient(to right, transparent, rgba(17,17,17,.95));
    pointer-events:none; z-index:21;
    transition:opacity .2s ease;
  }
  .tabs-wrap.scrolled-end::after{ opacity:0; }
  .tab-btn{
    flex:0 0 auto;
    scroll-snap-align:start;
    display:flex; align-items:center; gap:7px;
    background:var(--bg-card);
    border:1.5px solid var(--border);
    color:var(--ink-70);
    font-family:'Poppins',sans-serif; font-weight:600;
    font-size:13.5px;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .tab-btn .tab-emoji{ font-size:16px; filter:grayscale(1) brightness(1.6); }
  .tab-btn.active .tab-emoji{ filter:none; }
  .tab-btn.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
    box-shadow:0 4px 14px rgba(214,59,53,.4);
  }
  .tab-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Main content ---------- */
  main{ position:relative; z-index:1; padding:20px 16px 10px; max-width:640px; margin:0 auto; }
  .category-panel{ display:none; }
  .category-panel.active{ display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .no-results{ text-align:center; padding:50px 10px; color:var(--ink-45); display:none; }
  .no-results.show{ display:block; }
  .no-results .emoji{ font-size:34px; display:block; margin-bottom:10px; }

  .group-title{
    display:flex; align-items:center; gap:9px;
    margin:26px 0 12px;
  }
  .group-title:first-child{ margin-top:4px; }
  .group-title .group-emoji{ font-size:17px; line-height:1; }
  .group-title h2{ font-family:'Poppins',sans-serif; font-weight:700; font-size:16.5px; margin:0; color:var(--white); }
  .group-title .accent-bar{ width:4px; height:16px; border-radius:3px; background:var(--red); flex-shrink:0; }

  .info-banner{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-left:3px solid var(--gold);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    font-size:12.5px; color:var(--ink-70);
    margin-bottom:18px;
  }
  .info-banner strong{ color:var(--gold); font-weight:700; }
  .info-banner-icon{ font-size:15px; flex-shrink:0; }

  /* ---------- Product cards (grid, photo-first) ---------- */
  .products-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    margin-bottom:6px;
  }
  .products-grid.single{ grid-template-columns:1fr; }

  .product-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;
    display:flex; flex-direction:column;
  }
  .product-card:hover{ border-color:#3a3a3a; box-shadow:var(--shadow); }
  .product-card:active{ transform:scale(.97); }
  .product-card.pop{ animation:cardPop .32s ease; }
  @keyframes cardPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(.93); }
    65%{ transform:scale(1.04); }
    100%{ transform:scale(1); }
  }

  .product-photo{
    aspect-ratio:1.15/1;
    background:
      radial-gradient(120% 100% at 30% 0%, rgba(214,59,53,.28), transparent 60%),
      radial-gradient(120% 100% at 90% 100%, rgba(217,178,107,.18), transparent 55%),
      var(--bg-card-2);
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
    position:relative;
    overflow:hidden;
  }
  .product-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .products-grid.single .product-card{ flex-direction:row; align-items:stretch; }
  .products-grid.single .product-photo{ aspect-ratio:auto; width:88px; flex-shrink:0; font-size:32px; }

  .product-body{ padding:12px 13px 13px; flex:1; display:flex; flex-direction:column; }
  .product-name{ font-weight:700; font-size:14px; margin:0 0 4px; line-height:1.25; }
  .product-desc{ font-size:11px; color:var(--ink-45); margin:0 0 10px; line-height:1.4; flex:1; }
  .product-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; }
  .product-price{ font-weight:800; font-size:14px; color:var(--gold); }
  .product-price.consult{ font-size:10.5px; font-weight:700; color:var(--ink-45); text-transform:uppercase; letter-spacing:.04em; }

  .add-btn{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:var(--red); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800; line-height:1; cursor:pointer;
    box-shadow:0 3px 10px rgba(214,59,53,.45);
    transition:transform .15s ease;
  }
  .add-btn:active{ transform:scale(.85); }

  /* Menu diario card */
  .menu-diario-card{
    background:
      radial-gradient(140% 100% at 50% -20%, rgba(217,178,107,.16), transparent 60%),
      var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius); padding:22px 18px;
    text-align:center;
  }
  .menu-diario-card .emoji-big{ font-size:38px; display:block; margin-bottom:10px; }
  .menu-diario-card h2{ font-weight:800; font-size:18px; margin:0 0 8px; }
  .menu-diario-card p{ color:var(--ink-70); font-size:13px; line-height:1.6; margin:0 0 18px; }
  .btn-primary{
    background:var(--red); color:#fff; border:none; border-radius:999px;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:14.5px;
    padding:13px 26px; cursor:pointer; box-shadow:0 6px 18px rgba(214,59,53,.4);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:active{ transform:scale(.97); }
  .btn-primary:disabled{ opacity:.4; box-shadow:none; cursor:not-allowed; }

  /* ---------- Floating cart dock bar ---------- */
  .cart-dock{
    position:fixed; left:14px; right:14px; bottom:calc(14px + var(--safe-bottom)); z-index:40;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--red); color:#fff;
    border:none; border-radius:18px;
    padding:14px 16px;
    box-shadow:0 12px 30px rgba(214,59,53,.45);
    cursor:pointer;
    transform:translateY(140px);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.25);
    max-width:640px; margin:0 auto;
  }
  .cart-dock.show{ transform:translateY(0); }
  .cart-dock.shake{ animation:dockShake .4s ease; }
  @keyframes dockShake{
    0%,100%{ transform:translateY(0) rotate(0); }
    20%{ transform:translateY(0) rotate(-1.5deg) scale(1.02); }
    40%{ transform:translateY(0) rotate(1.5deg) scale(1.02); }
    60%{ transform:translateY(0) rotate(-1deg); }
    80%{ transform:translateY(0) rotate(1deg); }
  }
  .cart-dock-left{ display:flex; align-items:center; gap:10px; }
  .cart-dock-icon{ font-size:19px; }
  .cart-dock-count{ font-weight:700; font-size:13.5px; }
  .cart-dock-right{ display:flex; align-items:center; gap:10px; }
  .cart-dock-total{ font-weight:800; font-size:15px; transition:transform .18s ease; }
  .cart-dock-total.pulse{ animation:totalPulse .32s ease; }
  @keyframes totalPulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.18); color:#fff; }
    100%{ transform:scale(1); }
  }
  .cart-dock-cta{ font-weight:700; font-size:13px; display:flex; align-items:center; gap:4px; opacity:.95; }

  /* ---------- Sheets / Modals ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(2px);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51;
    background:var(--bg-elevated);
    border-top:1px solid var(--border);
    border-radius:22px 22px 0 0;
    max-height:88vh; overflow-y:auto;
    padding:10px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.9,.3,1.1);
    box-shadow:0 -10px 40px rgba(0,0,0,.55);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:40px; height:4px; background:var(--border); border-radius:999px; margin:10px auto 14px; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-header h3{ font-size:18px; font-weight:800; margin:0; }
  .sheet-close{
    background:var(--bg-card); border:1px solid var(--border); color:var(--white);
    width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* Product detail sheet */
  .pd-photo{
    width:100%; aspect-ratio:16/9; border-radius:var(--radius-sm); margin-bottom:16px;
    background:
      radial-gradient(120% 140% at 20% 0%, rgba(214,59,53,.3), transparent 60%),
      radial-gradient(120% 140% at 90% 100%, rgba(217,178,107,.2), transparent 55%),
      var(--bg-card-2);
    display:flex; align-items:center; justify-content:center; font-size:52px;
  }
  .pd-desc{ color:var(--ink-70); font-size:13.5px; line-height:1.5; margin-bottom:14px; }
  .pd-price{ font-weight:800; color:var(--gold); font-size:21px; margin-bottom:18px; }
  .field-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-45); font-weight:700; margin:14px 0 8px; }
  .protein-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid var(--border); background:var(--bg-card); color:var(--white);
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .15s ease;
  }
  .chip.selected{ background:var(--gold); border-color:var(--gold); color:#1a1206; }
  .chip:disabled{ opacity:.35; cursor:not-allowed; }
  textarea, input[type=text]{
    width:100%; background:var(--bg-card); border:1.5px solid var(--border); color:var(--white);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:14px; font-family:'Poppins',sans-serif;
    resize:vertical;
  }
  textarea:focus, input[type=text]:focus{ outline:none; border-color:var(--red); }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 6px; }
  .qty-stepper{ display:flex; align-items:center; gap:14px; background:var(--bg-card); border:1px solid var(--border); border-radius:999px; padding:6px 8px; }
  .qty-btn{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--border); color:var(--white);
    font-size:17px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-val{ font-weight:800; font-size:16px; min-width:18px; text-align:center; }
  .sheet-footer-btn{ width:100%; margin-top:18px; padding:15px; font-size:15.5px; }

  /* Cart sheet */
  .cart-line{ display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .cart-line:last-of-type{ border-bottom:none; }
  .cart-line-info{ flex:1; min-width:0; }
  .cart-line-name{ font-weight:700; font-size:14px; }
  .cart-line-meta{ font-size:11.5px; color:var(--ink-45); margin-top:2px; line-height:1.4; }
  .cart-line-side{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .cart-line-price{ font-weight:800; color:var(--gold); font-size:13.5px; }
  .cart-line-remove{ background:none; border:none; color:var(--ink-45); font-size:11.5px; cursor:pointer; text-decoration:underline; padding:0; }
  .mini-stepper{ display:flex; align-items:center; gap:8px; }
  .mini-stepper button{ width:22px; height:22px; border-radius:50%; border:1px solid var(--border); background:var(--bg-card); color:var(--white); cursor:pointer; font-size:13px; }
  .empty-cart{ text-align:center; padding:40px 10px; color:var(--ink-45); }
  .empty-cart .emoji-big{ font-size:44px; display:block; margin-bottom:12px; }
  .cart-summary{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-70); margin-bottom:6px; }
  .summary-row.total{ color:var(--white); font-weight:800; font-size:18px; margin-top:8px; }
  .summary-row.total span:last-child{ color:var(--gold); }

  /* Checkout sheet */
  .delivery-toggle{ display:flex; gap:10px; margin-bottom:4px; }
  .delivery-opt{
    flex:1; text-align:center; padding:14px 8px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    background:var(--bg-card); cursor:pointer; font-weight:700; font-size:13px;
  }
  .delivery-opt .sub{ display:block; font-weight:500; font-size:10.5px; color:var(--ink-45); margin-top:3px; }
  .delivery-opt.selected{ border-color:var(--red); background:rgba(214,59,53,.14); color:var(--white); }
  .delivery-opt.selected .sub{ color:var(--gold); }
  .pay-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pay-opt{
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:12px 8px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    background:var(--bg-card); cursor:pointer; font-weight:700; font-size:12.5px;
    transition:all .18s ease;
  }
  .pay-icon{ font-size:15px; line-height:1; filter:grayscale(1) brightness(1.5); transition:filter .18s ease; }
  .pay-opt.selected{ border-color:var(--gold); background:rgba(217,178,107,.14); color:var(--gold); box-shadow:0 3px 12px rgba(217,178,107,.15); }
  .pay-opt.selected .pay-icon{ filter:none; }
  .error-text{ color:var(--red); font-size:11.5px; margin-top:6px; display:none; }
  .error-text.show{ display:block; }
  .field-invalid{ border-color:var(--red) !important; }
  .toast{
    position:fixed; left:50%; bottom:112px; transform:translateX(-50%) translateY(20px);
    background:var(--white); color:#141110; font-weight:700; font-size:13px;
    padding:12px 20px; border-radius:999px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:all .3s ease; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{ text-align:center; padding:30px 20px 10px; color:var(--ink-45); font-size:11px; position:relative; z-index:1; }
</style>

<body>

<div class="hero">
  <div class="hero-blur" aria-hidden="true"></div>

  /* ---------------- SEARCH ---------------- */
  var searchInput = document.getElementById("searchInput");
  var searchWrap = document.getElementById("searchWrap");
  var searchClear = document.getElementById("searchClear");

  function applySearchFilter(term){
    term = (term || "").trim().toLowerCase();
    var activePanel = document.querySelector(".category-panel.active");
    if(!activePanel) return;

    var anyVisible = false;
    activePanel.querySelectorAll(".product-card").forEach(function(card){
      var match = !term || (card.dataset.search || "").indexOf(term) > -1;
      card.style.display = match ? "" : "none";
      if(match) anyVisible = true;
    });

    // hide group titles / empty grids when no children visible
    activePanel.querySelectorAll(".group-title").forEach(function(gt){
      var grid = gt.nextElementSibling;
      var hasVisible = grid && Array.from(grid.querySelectorAll(".product-card")).some(function(c){ return c.style.display !== "none"; });
      gt.style.display = hasVisible ? "" : "none";
      if(grid) grid.style.display = hasVisible ? "" : "none";
    });

    var noResults = activePanel.querySelector(".no-results");
    if(term && !anyVisible){
      if(!noResults){
        noResults = document.createElement("div");
        noResults.className = "no-results";
        noResults.innerHTML = "<span class='emoji'>🔍</span>Sin resultados para tu búsqueda.";
        activePanel.appendChild(noResults);
      }
      noResults.classList.add("show");
    } else if(noResults){
      noResults.classList.remove("show");
    }
  }

  searchInput.addEventListener("input", function(){
    var val = searchInput.value;
    searchWrap.classList.toggle("has-text", val.length > 0);
    applySearchFilter(val);
  });
  searchClear.addEventListener("click", function(){
    searchInput.value = "";
    searchWrap.classList.remove("has-text");
    applySearchFilter("");
    searchInput.focus();
  });

  /* ---------------- SHEETS: generic open/close ---------------- */
  var overlay = document.getElementById("overlay");
  var sheets = {
    product: document.getElementById("productSheet"),
    cart: document.getElementById("cartSheet"),
    checkout: document.getElementById("checkoutSheet")
  };

  function openSheet(name){
    Object.keys(sheets).forEach(function(k){ sheets[k].classList.toggle("show", k===name); });
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
  }
  function closeSheets(){
    Object.keys(sheets).forEach(function(k){ sheets[k].classList.remove("show"); });
    overlay.classList.remove("show");
    document.body.style.overflow = "";
  }
  overlay.addEventListener("click", closeSheets);
  document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeSheets); });

  /* ---------------- PRODUCT SHEET: simple item (Rolls / Entradas) ---------------- */
  function openSimpleProduct(product){
    document.getElementById("pdName").textContent = product.name;
    var content = document.getElementById("pdContent");
    var qty = 1;
    var priceLabel = product.price!=null ? fmt(product.price) : "Precio a consultar";

    content.innerHTML =
      "<div class='pd-photo'>" + photoHtml(product.emoji || "🍣", product.img, product.name) + "</div>" +
      (product.desc ? "<p class='pd-desc'>" + product.desc + "</p>" : "") +
      "<p class='pd-price'>" + priceLabel + "</p>" +
      "<div class='qty-row'>" +
        "<span class='field-label' style='margin:0;'>Cantidad</span>" +
        "<div class='qty-stepper'>" +
          "<button class='qty-btn' id='qtyMinus'>–</button>" +
          "<span class='qty-val' id='qtyVal'>1</span>" +
          "<button class='qty-btn' id='qtyPlus'>+</button>" +
        "</div>" +
      "</div>" +
      "<button class='btn-primary sheet-footer-btn' id='pdAddBtn'>Agregar" + (product.price!=null ? " · " + fmt(product.price) : "") + "</button>";

    var qtyVal = content.querySelector("#qtyVal");
    content.querySelector("#qtyMinus").addEventListener("click", function(){
      qty = Math.max(1, qty-1); qtyVal.textContent = qty; updateBtn();
    });
    content.querySelector("#qtyPlus").addEventListener("click", function(){
      qty = Math.min(20, qty+1); qtyVal.textContent = qty; updateBtn();
    });
    function updateBtn(){
      var btn = content.querySelector("#pdAddBtn");
      if(product.price!=null){
        btn.textContent = "Agregar · " + fmt(product.price * qty);
      } else {
        btn.textContent = "Agregar (" + qty + ")";
      }
    }
    content.querySelector("#pdAddBtn").addEventListener("click", function(){
      addToCart({
        id: uid(),
        name: product.name,
        category: product.category,
        unitPrice: product.price,
        qty: qty,
        meta: product.desc || null,
        consult: product.price==null
      });
      closeSheets();
      showToast(product.name + " agregado ✓");
    });

    openSheet("product");
  }

  /* ---------------- PRODUCT SHEET: Gohan builder ---------------- */
  function openGohanProduct(opt){
    document.getElementById("pdName").textContent = "Gohan · " + opt.name;
    var content = document.getElementById("pdContent");
    var qty = 1;
    var selected = [];

    var proteinHtml = "";
    if(opt.count > 0){
      proteinHtml =
        "<p class='field-label' style='margin-top:0;'>Elegí " + opt.count + " variedad" + (opt.count>1?"es":"") + "</p>" +
        "<div class='protein-grid' id='proteinGrid'>" +
        DATA.gohan.proteins.map(function(p){
          return "<button type='button' class='chip' data-protein=\"" + p + "\">" + p + "</button>";
        }).join("") +
        "</div>";
    }

    content.innerHTML =
      "<div class='pd-photo'>" + photoHtml(opt.emoji, opt.img, opt.name) + "</div>" +
      "<p class='pd-desc'>" + (opt.sub || "Elegí tu combinación de gohan") + "</p>" +
      "<p class='pd-price'>" + fmt(opt.price) + "</p>" +
      proteinHtml +
      "<div class='qty-row'>" +
        "<span class='field-label' style='margin:0;'>Cantidad</span>" +
        "<div class='qty-stepper'>" +
          "<button class='qty-btn' id='qtyMinus'>–</button>" +
          "<span class='qty-val' id='qtyVal'>1</span>" +
          "<button class='qty-btn' id='qtyPlus'>+</button>" +
        "</div>" +
      "</div>" +
      "<button class='btn-primary sheet-footer-btn' id='pdAddBtn' " + (opt.count>0 ? "disabled" : "") + ">Agregar · " + fmt(opt.price) + "</button>";

    var qtyVal = content.querySelector("#qtyVal");
    content.querySelector("#qtyMinus").addEventListener("click", function(){ qty=Math.max(1,qty-1); qtyVal.textContent=qty; updateBtn(); });
    content.querySelector("#qtyPlus").addEventListener("click", function(){ qty=Math.min(20,qty+1); qtyVal.textContent=qty; updateBtn(); });

    var addBtn = content.querySelector("#pdAddBtn");
    function updateBtn(){ addBtn.textContent = "Agregar · " + fmt(opt.price * qty); }

    if(opt.count > 0){
      var chips = content.querySelectorAll("[data-protein]");
      chips.forEach(function(chip){
        chip.addEventListener("click", function(){
          var p = chip.dataset.protein;
          var idx = selected.indexOf(p);
          if(idx > -1){
            selected.splice(idx,1);
            chip.classList.remove("selected");
          } else {
            if(selected.length >= opt.count) return;
            selected.push(p);
            chip.classList.add("selected");
          }
          chips.forEach(function(c){
            if(selected.length >= opt.count && !c.classList.contains("selected")) c.disabled = true;
            else c.disabled = false;
          });
          addBtn.disabled = selected.length !== opt.count;
        });
      });
    }

    addBtn.addEventListener("click", function(){
      if(opt.count>0 && selected.length !== opt.count) return;
      addToCart({
        id: uid(),
        name: "Gohan · " + opt.name,
        category:"Gohan",
        unitPrice: opt.price,
        qty: qty,
        meta: opt.count>0 ? selected.join(", ") : "Verduras de estación",
        consult:false
      });
      closeSheets();
      showToast("Gohan agregado ✓");
    });

    openSheet("product");
  }

  /* ---------------- CART LOGIC ---------------- */
  function addToCart(entry){
    cart.push(entry);
    saveCart();
    renderCartUI({ animate:true });
  }

  function removeFromCart(id){
    cart = cart.filter(function(i){ return i.id !== id; });
    saveCart();
    renderCartUI();
  }

  function changeQty(id, delta){
    var item = cart.find(function(i){ return i.id === id; });
    if(!item) return;
    item.qty = Math.max(1, item.qty + delta);
    saveCart();
    renderCartUI();
  }

  function cartSubtotal(){
    return cart.reduce(function(sum,i){ return sum + (i.consult ? 0 : i.unitPrice * i.qty); }, 0);
  }
  function cartCount(){
    return cart.reduce(function(sum,i){ return sum + i.qty; }, 0);
  }

  var cartFab = document.getElementById("cartFab");
  var cartCountEl = document.getElementById("cartCount");
  var cartFabTotal = document.getElementById("cartFabTotal");

  function renderCartUI(opts){
    opts = opts || {};
    var count = cartCount();
    cartCountEl.textContent = count + (count === 1 ? " producto" : " productos");
    cartFabTotal.textContent = fmt(cartSubtotal());
    cartFab.classList.toggle("show", count > 0);

    if(opts.animate){
      cartFab.classList.remove("shake");
      void cartFab.offsetWidth;
      cartFab.classList.add("shake");
      cartFabTotal.classList.remove("pulse");
      void cartFabTotal.offsetWidth;
      cartFabTotal.classList.add("pulse");
    }
    renderCartSheet();
  }

  function renderCartSheet(){
    var el = document.getElementById("cartContent");
    if(cart.length === 0){
      el.innerHTML =
        "<div class='empty-cart'>" +
          "<span class='emoji-big'>🍣</span>" +
          "<p>Tu pedido está vacío.<br>Agregá algo rico del menú.</p>" +
        "</div>";
      return;
    }
    var html = "";
    cart.forEach(function(item){
      var priceStr = item.consult ? "Consultar" : fmt(item.unitPrice * item.qty);
      html +=
        "<div class='cart-line'>" +
          "<div class='cart-line-info'>" +
            "<div class='cart-line-name'>" + item.name + "</div>" +
            (item.meta ? "<div class='cart-line-meta'>" + item.meta + "</div>" : "") +
            "<div class='mini-stepper' style='margin-top:8px;'>" +
              "<button data-act='minus' data-id='" + item.id + "'>–</button>" +
              "<span style='font-size:12.5px;font-weight:700;'>" + item.qty + "</span>" +
              "<button data-act='plus' data-id='" + item.id + "'>+</button>" +
            "</div>" +
          "</div>" +
          "<div class='cart-line-side'>" +
            "<span class='cart-line-price'>" + priceStr + "</span>" +
            "<button class='cart-line-remove' data-act='remove' data-id='" + item.id + "'>Quitar</button>" +
          "</div>" +
        "</div>";
    });

    var subtotal = cartSubtotal();
    var hasConsult = cart.some(function(i){ return i.consult; });

    html +=
      "<div class='cart-summary'>" +
        "<div class='summary-row'><span>Subtotal</span><span>" + fmt(subtotal) + "</span></div>" +
        (hasConsult ? "<div class='summary-row'><span>Ítems a consultar</span><span>se coordinan por WhatsApp</span></div>" : "") +
        "<div class='summary-row total'><span>Total</span><span>" + fmt(subtotal) + "</span></div>" +
      "</div>" +
      "<button class='btn-primary sheet-footer-btn' id='goCheckout'>Continuar con el pedido</button>";

    el.innerHTML = html;

    el.querySelectorAll("[data-act]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.dataset.id;
        var act = btn.dataset.act;
        if(act === "plus") changeQty(id, 1);
        else if(act === "minus") changeQty(id, -1);
        else if(act === "remove") removeFromCart(id);
      });
    });

    var goBtn = el.querySelector("#goCheckout");
    if(goBtn) goBtn.addEventListener("click", openCheckout);
  }

  cartFab.addEventListener("click", function(){
    renderCartSheet();
    openSheet("cart");
  });

  /* ---------------- CHECKOUT ---------------- */
  function openCheckout(){
    var el = document.getElementById("checkoutContent");
    el.innerHTML =
      "<p class='field-label' style='margin-top:0;'>Tipo de entrega</p>" +
      "<div class='delivery-toggle'>" +
        "<div class='delivery-opt' data-delivery='delivery'>Delivery<span class='sub'>+ " + fmt(DELIVERY_COST) + "</span></div>" +
        "<div class='delivery-opt' data-delivery='retiro'>Retiro en local<span class='sub'>Sin cargo</span></div>" +
      "</div>" +

      "<div id='addressWrap' style='margin-top:14px;'>" +
        "<p class='field-label'>Dirección y barrio</p>" +
        "<input type='text' id='addressInput' placeholder='Calle, número y barrio'>" +
        "<p class='error-text' id='addressError'>Ingresá la dirección para el delivery.</p>" +
      "</div>" +

      "<p class='field-label'>Nombre completo</p>" +
      "<input type='text' id='nameInput' placeholder='Tu nombre'>" +
      "<p class='error-text' id='nameError'>Ingresá tu nombre.</p>" +

      "<p class='field-label'>Método de pago</p>" +
      "<div class='pay-toggle'>" +
        "<div class='pay-opt' data-pay='Efectivo'><span class='pay-icon'>💵</span>Efectivo</div>" +
        "<div class='pay-opt' data-pay='Transferencia'><span class='pay-icon'>🏦</span>Transferencia</div>" +
        "<div class='pay-opt' data-pay='QR'><span class='pay-icon'>📱</span>QR</div>" +
        "<div class='pay-opt' data-pay='Débito'><span class='pay-icon'>💳</span>Débito</div>" +
      "</div>" +

      "<p class='field-label'>Notas (opcional)</p>" +
      "<textarea id='notesInput' rows='2' placeholder='Ej: sin salsa de soja, timbre roto...'></textarea>" +

      "<div class='cart-summary'>" +
        "<div class='summary-row'><span>Subtotal</span><span id='sumSubtotal'>$0</span></div>" +
        "<div class='summary-row'><span>Envío</span><span id='sumEnvio'>$0</span></div>" +
        "<div class='summary-row total'><span>Total</span><span id='sumTotal'>$0</span></div>" +
      "</div>" +

      "<button class='btn-primary sheet-footer-btn' id='sendOrderBtn'>Enviar pedido por WhatsApp</button>";

    var deliveryOpts = el.querySelectorAll("[data-delivery]");
    function setDelivery(val){
      checkoutState.delivery = val;
      deliveryOpts.forEach(function(o){ o.classList.toggle("selected", o.dataset.delivery === val); });
      document.getElementById("addressWrap").style.display = val === "delivery" ? "block" : "none";
      updateSummary();
    }
    deliveryOpts.forEach(function(o){ o.addEventListener("click", function(){ setDelivery(o.dataset.delivery); }); });
    setDelivery(checkoutState.delivery);

    var payOpts = el.querySelectorAll("[data-pay]");
    function setPay(val){
      checkoutState.payment = val;
      payOpts.forEach(function(o){ o.classList.toggle("selected", o.dataset.pay === val); });
    }
    payOpts.forEach(function(o){ o.addEventListener("click", function(){ setPay(o.dataset.pay); }); });
    setPay(checkoutState.payment);

    function updateSummary(){
      var subtotal = cartSubtotal();
      var envio = checkoutState.delivery === "delivery" ? DELIVERY_COST : 0;
      document.getElementById("sumSubtotal").textContent = fmt(subtotal);
      document.getElementById("sumEnvio").textContent = fmt(envio);
      document.getElementById("sumTotal").textContent = fmt(subtotal + envio);
    }
    updateSummary();

    document.getElementById("sendOrderBtn").addEventListener("click", function(){
      var name = document.getElementById("nameInput").value.trim();
      var address = document.getElementById("addressInput") ? document.getElementById("addressInput").value.trim() : "";
      var notes = document.getElementById("notesInput").value.trim();

      var valid = true;
      var nameErr = document.getElementById("nameError");
      var nameInput = document.getElementById("nameInput");
      if(!name){
        nameErr.classList.add("show"); nameInput.classList.add("field-invalid"); valid = false;
      } else {
        nameErr.classList.remove("show"); nameInput.classList.remove("field-invalid");
      }

      if(checkoutState.delivery === "delivery"){
        var addrErr = document.getElementById("addressError");
        var addrInput = document.getElementById("addressInput");
        if(!address){
          addrErr.classList.add("show"); addrInput.classList.add("field-invalid"); valid = false;
        } else {
          addrErr.classList.remove("show"); addrInput.classList.remove("field-invalid");
        }
      }

      if(!valid) return;

      sendOrder({ name:name, address:address, notes:notes });
    });

    openSheet("checkout");
  }

  function sendOrder(customer){
    var subtotal = cartSubtotal();
    var envio = checkoutState.delivery === "delivery" ? DELIVERY_COST : 0;
    var total = subtotal + envio;

    var lines = [];
    lines.push("🍣 *NUEVO PEDIDO - SAKKA SUSHI* 🍣");
    lines.push("----------------------------------");
    lines.push("*Cliente:* " + customer.name);
    lines.push("*Entrega:* " + (checkoutState.delivery === "delivery" ? "Delivery" : "Retiro en local"));
    if(checkoutState.delivery === "delivery"){
      lines.push("*Dirección:* " + customer.address);
    }
    lines.push("*Pago:* " + checkoutState.payment);
    lines.push("");
    lines.push("📋 *DETALLE:*");
    cart.forEach(function(item){
      var priceStr = item.consult ? "Consultar" : fmt(item.unitPrice * item.qty);
      var line = "- " + item.qty + "x " + item.name + " (" + priceStr + ")";
      lines.push(line);
      if(item.meta) lines.push("   " + item.meta);
    });
    lines.push("");
    lines.push("Subtotal: " + fmt(subtotal));
    lines.push("🛵 Envío: " + fmt(envio));
    lines.push("💵 *TOTAL FINAL: " + fmt(total) + "*");
    if(customer.notes){
      lines.push("");
      lines.push("*Notas:* " + customer.notes);
    }
    lines.push("");
    lines.push("----------------------------------");
    lines.push("¡Aguardamos confirmación!");

    var msg = lines.join("\n");
    var url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);

    window.open(url, "_blank");

    cart = [];
    saveCart();
    renderCartUI();
    closeSheets();
    showToast("¡Pedido enviado! 🍣");
  }

  /* ---------------- TOAST ---------------- */
  var toastTimer = null;
  function showToast(text){
    var t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ---------------- CARD POP ANIMATION on add-btn click ---------------- */
  document.addEventListener("click", function(e){
    var btn = e.target.closest(".add-btn");
    if(!btn) return;
    var card = btn.closest(".product-card");
    if(card){
      card.classList.remove("pop");
      void card.offsetWidth;
      card.classList.add("pop");
    }
  }, true);

  /* ---------------- INIT ---------------- */
  renderCartUI();
  updateTabsFade();

})();
</script>
</body>
</html>
